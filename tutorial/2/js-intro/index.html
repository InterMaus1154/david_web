
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Introduction | The Daily Grind</title>

    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
    <h1>The Daily Grind</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#drinks">Drinks</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<main>
    <section id="home">
        <h2>Welcome to The Daily Grind</h2>
        <p>Fresh coffee, every single day.</p>

        <button class="welcome-button">Say hello</button>
        <p class="welcome-message"></p>
    </section>

    <section id="drinks">
        <h2>Our Drinks</h2>

        <ul class="drink-list">
            <li>Espresso</li>
            <li>Cappuccino</li>
            <li>Latte</li>
            <li>Iced Coffee</li>
        </ul>

        <button class="drink-button">Highlight drinks</button>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>

        <label for="customer-name">Your name:</label>
        <input type="text" id="customer-name">

        <button class="greeting-button">Submit</button>

        <p class="greeting-message"></p>
    </section>

    <section>
        <h2>Today's Special</h2>

        <p class="special-drink">
            Today's special is a Cappuccino!
        </p>

        <button class="special-button">Change special</button>
    </section>
</main>

<footer>
    <p>&copy; 2026 The Daily Grind</p>
</footer>

</body>
</html>
