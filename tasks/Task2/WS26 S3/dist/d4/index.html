<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D4 - Fix the Page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>D4 - Fix the Page</h1>
    </header>

    <main>
      <form class="card" action="#" method="post">
        <h3>
          <img class="heading-icon" src="img/icon-booking.svg" />
          Your booking
        </h3>

        <div class="field">
          <input
            id="reference"
            name="reference"
            type="text"
            placeholder="Booking reference"
          />
        </div>

        <div class="field">
          <input
            id="surname"
            name="surname"
            type="text"
            placeholder="Surname"
          />
        </div>

        <div class="field">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Email address"
          />
        </div>

        <div class="field">
          <select id="baggage" name="baggage">
            <option value="0">No checked baggage</option>
            <option value="1">1 checked bag (23 kg)</option>
            <option value="2">2 checked bags (2 x 23 kg)</option>
          </select>
        </div>

        <h3>
          <img class="heading-icon" src="img/icon-seat.svg" />
          Your seat
        </h3>

        <img class="seat-map" src="img/seat-map.svg" />

        <div class="button" onclick="this.closest('form').submit()">
          Continue to boarding pass
        </div>
      </form>
    </main>
    <!--Do not modify any code after this line-->
    <footer id="dynamicFooter"></footer>
    <script>
      document.getElementById('dynamicFooter').innerHTML =
        '&copy; ' +
        new Date().getFullYear() +
        ' WorldSkills | All rights reserved.';
    </script>
  </body>
</html>
